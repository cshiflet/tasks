[package]
name = "tasks-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Qt 6 (cxx-qt) front-end for the Tasks.org native desktop client."

[[bin]]
name = "tasks-desktop"
path = "src/main.rs"

[dependencies]
tasks-core = { path = "../tasks-core" }
tasks-sync = { path = "../tasks-sync" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
cxx = { workspace = true }
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true }
# Secret-wrapped password on `StoredAccount` so the ViewModel can't
# stringify / log the raw bytes, and the value zeroes on drop.
secrecy = { workspace = true }
# Async runtime hosting `tasks-sync::SyncEngine` calls. We pin the
# `rt-multi-thread` feature so providers can spawn their own
# fan-out work without blocking the UI thread; the bridge owns
# exactly one Runtime instance shared across every Sync now click.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
# Generate cda_uuid values for accounts created via the
# Accounts pane. Mirrors the `uuid` dep pattern used by tasks-core.
uuid = { version = "1", features = ["v4"] }
# Direct SQLite access for the bridge's writeback path on
# add_password_account / remove_account / sync_account, which
# need to mutate caldav_accounts without going through tasks-core.
rusqlite = { workspace = true }
# Preferences persistence — small JSON blob in
# `<dirs::config_dir()>/tasks-desktop/preferences.json`. Avoids the
# QSettings FFI surface (not exposed by cxx-qt-lib in our pinned
# version) and keeps the on-disk format easy to inspect / hand-edit.
dirs = "5"
serde = { workspace = true }
serde_json = "1"

# The Win32 dark-title-bar shim is implemented with bare
# `extern "system"` declarations in `src/win_dark_titlebar.rs` —
# no `windows-sys` dep needed. The four functions + four
# constants we use are stable Win32 surface and the signatures
# don't drift, which avoids the breaking-change churn between
# windows-sys 0.59 / 0.60 / 0.61 we'd otherwise have to track.

[build-dependencies]
cxx-qt-build = { workspace = true }
